name: schema-validate

# Reproducible validation for the FHIR R5 terminology resources.
# The previous flow was a one-off local run with hardcoded Windows paths,
# so the "11/11 PASS" claim could not be reproduced from the repository.
# This CI re-validates every resource JSON on each push/PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate all FHIR R5 resources (fails on any error)
        run: python validate_all_schema.py --schema .cache/fhir.schema.json --out schema_report.txt

      - name: Show report
        run: cat schema_report.txt
